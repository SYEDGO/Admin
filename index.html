<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#7C3AED" />
<title>SwatGo Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --brand: #7C3AED;
  --brand-dark: #6D28D9;
  --brand-light: #EDE9FE;
  --accent: #F59E0B;
  --accent-light: #FEF3C7;
  --success: #10B981;
  --danger: #EF4444;
  --info: #3B82F6;
  --bg: #F8FAFC;
  --card: #FFFFFF;
  --text: #0F172A;
  --text-light: #64748B;
  --text-soft: #94A3B8;
  --border: #E2E8F0;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 20px rgba(0,0,0,0.06);
  --shadow-lg: 0 10px 40px rgba(0,0,0,0.08);
  --radius: 18px;
  --radius-sm: 12px;
  --input-bg: #FFFFFF;
}
body.dark {
  --bg: #0F172A;
  --card: #1E293B;
  --text: #F1F5F9;
  --text-light: #94A3B8;
  --text-soft: #64748B;
  --border: #334155;
  --input-bg: #1E293B;
  --brand-light: rgba(124, 58, 237, 0.2);
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); display: flex; justify-content: center; min-height: 100vh; color: var(--text); transition: background 0.3s; }
.app { width: 100%; max-width: 480px; background: var(--bg); min-height: 100vh; position: relative; padding-bottom: 90px; overflow-x: hidden; }

#splash { position: fixed; inset: 0; background: linear-gradient(135deg, #7C3AED, #6D28D9); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.5s; }
#splash h1 { font-size: 38px; font-weight: 800; letter-spacing: -1px; margin-bottom: 6px; animation: splashIn 0.6s ease; }
#splash p { color: rgba(255,255,255,0.85); font-size: 14px; font-weight: 500; animation: splashIn 0.8s ease; }
#splash .loader { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.25); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-top: 28px; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes splashIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

.topbar { padding: 16px 20px; background: linear-gradient(135deg, #7C3AED 0%, #6D28D9 100%); color: #fff; position: sticky; top: 0; z-index: 10; overflow: hidden; }
.topbar::after { content: ''; position: absolute; top: -60px; right: -60px; width: 160px; height: 160px; background: rgba(255,255,255,0.08); border-radius: 50%; pointer-events: none; }
.topbar::before { content: ''; position: absolute; bottom: -40px; left: -40px; width: 120px; height: 120px; background: rgba(255,255,255,0.06); border-radius: 50%; pointer-events: none; }
.topbar-top { display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2; gap: 10px; }
.topbar h1 { font-size: 18px; font-weight: 800; letter-spacing: -0.4px; }
.topbar .logout { font-size: 11px; font-weight: 700; padding: 6px 14px; border-radius: 20px; background: rgba(255,255,255,0.18); cursor: pointer; border: 1px solid rgba(255,255,255,0.2); transition: all 0.2s; }
.topbar .logout:active { transform: scale(0.95); }

main { padding: 18px 16px; }
h2 { font-size: 17px; margin-bottom: 12px; color: var(--text); font-weight: 800; letter-spacing: -0.3px; display: flex; align-items: center; gap: 6px; }
h3 { font-size: 15px; color: var(--text); font-weight: 700; }
p { font-size: 13px; color: var(--text-light); line-height: 1.5; }
.card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-md); border: 1px solid rgba(226,232,240,0.5); animation: cardIn 0.4s ease backwards; }
@keyframes cardIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

.bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 480px; display: flex; justify-content: space-around; background: var(--card); border-top: 1px solid var(--border); padding: 8px 0 12px; z-index: 100; overflow-x: auto; scrollbar-width: none; box-shadow: 0 -4px 20px rgba(0,0,0,0.04); }
.bottom-nav::-webkit-scrollbar { display: none; }
.bottom-nav button { background: none; border: none; display: flex; flex-direction: column; align-items: center; font-size: 9px; font-weight: 700; color: var(--text-soft); cursor: pointer; position: relative; flex: 1; padding: 4px 6px; min-width: 55px; gap: 3px; }
.bottom-nav button svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.bottom-nav button.active { color: var(--brand); }
.bottom-nav button.active svg { stroke-width: 2.5; }
.bottom-nav button.active::before { content: ''; position: absolute; top: -1px; left: 50%; transform: translateX(-50%); width: 30px; height: 30px; background: var(--brand-light); border-radius: 12px; z-index: -1; }
.badge { position: absolute; top: 0px; right: 20%; background: var(--danger); color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 10px; font-weight: 800; border: 2px solid var(--card); }
.hidden { display: none !important; }

.btn { border: none; border-radius: 12px; padding: 12px 18px; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.15s; }
.btn:active { transform: scale(0.96); }
.btn-primary { background: linear-gradient(135deg, #7C3AED, #6D28D9); color: #fff; box-shadow: 0 4px 12px rgba(124,58,237,0.25); }
.btn-success { background: linear-gradient(135deg, #10B981, #059669); color: #fff; box-shadow: 0 4px 12px rgba(16,185,129,0.25); }
.btn-danger { background: linear-gradient(135deg, #EF4444, #DC2626); color: #fff; box-shadow: 0 4px 12px rgba(239,68,68,0.25); }
.btn-warning { background: linear-gradient(135deg, #F59E0B, #D97706); color: #fff; box-shadow: 0 4px 12px rgba(245,158,11,0.25); }
.btn-outline { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
.btn-block { width: 100%; }
.btn-sm { padding: 8px 14px; font-size: 11px; border-radius: 10px; }

.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.stat-box { background: var(--card); padding: 16px; border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); border: 1px solid rgba(226,232,240,0.5); }
.stat-box .num { font-size: 22px; font-weight: 800; color: var(--text); font-feature-settings: 'tnum'; letter-spacing: -0.5px; }
.stat-box .lbl { font-size: 10px; color: var(--text-light); text-transform: uppercase; margin-top: 4px; font-weight: 700; letter-spacing: 0.5px; }
.stat-box.accent { background: linear-gradient(135deg, #7C3AED, #6D28D9); color: #fff; grid-column: span 2; box-shadow: 0 6px 20px rgba(124,58,237,0.25); }
.stat-box.accent .num { color: #fff; font-size: 28px; }
.stat-box.accent .lbl { color: rgba(255,255,255,0.75); }
.stat-box.green .num { color: var(--success); }
.stat-box.red .num { color: var(--danger); }
.stat-box.blue .num { color: var(--info); }
.stat-box.amber .num { color: var(--accent); }

.filter-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 8px; scrollbar-width: none; }
.filter-chips::-webkit-scrollbar { display: none; }
.filter-chip { flex-shrink: 0; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 7px 14px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--text-light); transition: all 0.15s; }
.filter-chip.active { background: linear-gradient(135deg, #7C3AED, #6D28D9); color: #fff; border-color: var(--brand); }
.filter-chip:active { transform: scale(0.95); }

.search-input { width: 100%; padding: 14px 16px; border: 1px solid var(--border); border-radius: 14px; font-size: 14px; margin-bottom: 14px; outline: none; background: var(--input-bg); color: var(--text); font-weight: 500; transition: all 0.2s; }
.search-input:focus { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(124,58,237,0.1); }

.list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.order-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 12px; gap: 10px; }
.order-row span:first-child { color: var(--text-light); font-weight: 500; }
.order-row span:last-child { font-weight: 700; color: var(--text); text-align: right; }

.status-chip { font-size: 10px; padding: 5px 12px; border-radius: 20px; background: var(--brand-light); color: var(--brand-dark); font-weight: 800; letter-spacing: 0.3px; text-transform: uppercase; }
.status-chip.pending { background: #FEE2E2; color: #991B1B; }
.status-chip.accepted { background: #DBEAFE; color: #1E40AF; }
.status-chip.ready { background: #FEF3C7; color: #92400E; }
.status-chip.assigned { background: #DBEAFE; color: #1E40AF; }
.status-chip.delivered { background: #D1FAE5; color: #166534; }
.status-chip.cancelled { background: #F1F5F9; color: #64748B; }

.overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.5); z-index: 1000; display: flex; align-items: flex-end; justify-content: center; animation: fadeIn 0.2s; backdrop-filter: blur(4px); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.sheet { background: var(--card); width: 100%; max-width: 480px; border-radius: 28px 28px 0 0; padding: 8px 24px 24px; max-height: 92vh; overflow-y: auto; color: var(--text); animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); position: relative; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.sheet::before { content: ''; display: block; width: 40px; height: 4px; background: #CBD5E1; border-radius: 2px; margin: 8px auto 16px; }
.sheet h3 { margin-bottom: 16px; font-size: 20px; font-weight: 800; letter-spacing: -0.4px; }

.form-input { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 14px; margin-bottom: 12px; font-size: 14px; outline: none; background: var(--input-bg); color: var(--text); font-weight: 500; transition: all 0.2s; font-family: inherit; }
.form-input:focus { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(124,58,237,0.1); }
.form-label { font-size: 12px; color: var(--text-light); margin-bottom: 6px; display: block; font-weight: 600; }

.toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px); padding: 14px 22px; border-radius: 14px; font-size: 13px; font-weight: 700; z-index: 9999; opacity: 0; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none; max-width: 90%; display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); color: #fff; background: linear-gradient(135deg, #7C3AED, #6D28D9); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast::before { content: '✓'; display: inline-flex; width: 22px; height: 22px; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; border-radius: 50%; background: rgba(255,255,255,0.25); flex-shrink: 0; }
.toast.error { background: linear-gradient(135deg, #EF4444, #DC2626); }
.toast.error::before { content: '!'; }
.toast.info { background: linear-gradient(135deg, #3B82F6, #2563EB); }
.toast.info::before { content: 'i'; font-family: serif; }
.toast.warning { background: linear-gradient(135deg, #F59E0B, #D97706); }
.toast.warning::before { content: '⚠'; font-size: 11px; }

.empty { text-align: center; color: var(--text-light); padding: 50px 20px; font-size: 14px; font-weight: 500; animation: cardIn 0.5s ease; }
.empty svg { width: 140px; height: 140px; margin: 0 auto 16px; display: block; opacity: 0.9; }
.empty h3 { font-size: 17px; color: var(--text); font-weight: 800; margin-bottom: 6px; letter-spacing: -0.3px; }
.empty p { font-size: 13px; line-height: 1.5; max-width: 260px; margin: 0 auto 18px; }

.chart-container { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; border: 1px solid var(--border); }
.chart-container canvas { max-height: 220px; }

.dark-toggle { position: fixed; top: 72px; right: 16px; z-index: 50; width: 42px; height: 42px; border-radius: 50%; background: var(--card); color: var(--text); border: 1px solid var(--border); cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-md); transition: all 0.2s; }
.dark-toggle:active { transform: scale(0.9); }

.rating-badge { display: inline-flex; align-items: center; gap: 4px; background: linear-gradient(135deg, #FBBF24, #F59E0B); color: #fff; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 20px; box-shadow: 0 2px 8px rgba(245,158,11,0.25); }
.report-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 500; }
.report-row:last-child { border-bottom: none; }
.export-btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.location-badge { display: inline-block; font-size: 10px; padding: 4px 10px; border-radius: 12px; font-weight: 700; }
.location-badge.ok { background: #D1FAE5; color: #166534; }
.location-badge.missing { background: #FEE2E2; color: #991B1B; }

.skeleton { background: linear-gradient(90deg, var(--border) 25%, rgba(226,232,240,0.4) 50%, var(--border) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
</style>
</head>
<body>
<div id="splash"><h1>SwatGo</h1><p>Admin Control Panel</p><div class="loader"></div></div>
<div class="app">
  <header class="topbar">
    <div class="topbar-top">
      <h1>⚙️ SwatGo Admin</h1>
      <div class="logout" onclick="adminLogout()">Logout</div>
    </div>
  </header>
  <button class="dark-toggle" onclick="toggleDarkMode()" id="darkToggle">🌙</button>
  <main id="app"></main>
  <nav class="bottom-nav" id="bottomNav">
    <button data-tab="dashboard" class="active"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Dashboard</button>
    <button data-tab="orders"><svg viewBox="0 0 24 24"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>Orders<span id="orderBadge" class="badge hidden">0</span></button>
    <button data-tab="merchants"><svg viewBox="0 0 24 24"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v10a1 1 0 001 1h14a1 1 0 001-1V9"/><path d="M3 9h18"/><path d="M9 13h6"/></svg>Shops</button>
    <button data-tab="riders"><svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/><path d="M4 18V6h11l3 5h2v7"/><path d="M4 10h9"/></svg>Riders</button>
    <button data-tab="customers"><svg viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Users</button>
    <button data-tab="payouts"><svg viewBox="0 0 24 24"><line x1="12" y1="2" x2="12" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Payouts</button>
    <button data-tab="reports"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>Reports</button>
    <button data-tab="settings"><svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>Settings</button>
  </nav>
</div>
<div id="toast" class="toast"></div>
<div id="modalRoot"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, updateDoc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyDGykbkZ4ITxkEgcxaQNZlH9rFO86c-xEU", authDomain: "syedgo-2027.firebaseapp.com", projectId: "syedgo-2027", storageBucket: "syedgo-2027.firebasestorage.app", messagingSenderId: "827702342584", appId: "1:827702342584:web:a3d717e8b1bcf93529954d", measurementId: "G-L0B1K6N1EY" };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const ADMIN_PASSWORD = "Sallu2009";

  let state = {
    tab: "dashboard",
    isLoggedIn: localStorage.getItem("syedgo_admin_logged") === "true",
    orders: [], merchants: [], riders: [], customers: [], payouts: [], reviews: [],
    orderFilter: "all", searchQuery: "",
    settings: { commissionRate: 10, deliveryFee: 150, platformFee: 30, riderCut: 120, ratePerKm: 40, minDeliveryFee: 50, maxDeliveryFee: 500, featuredMerchants: [] },
    listeners: {},
    darkMode: localStorage.getItem("syedgo_admin_dark") === "true",
    reportRange: "7days"
  };

  let salesChartInstance = null, ordersChartInstance = null;

  function toast(msg, type) { const t = document.getElementById("toast"); t.textContent = msg; t.className = "toast " + (type || ""); t.classList.add("show"); clearTimeout(window._t); window._t = setTimeout(() => t.classList.remove("show"), 2600); }
  function closeModal() { document.getElementById("modalRoot").innerHTML = ""; }

  function adminLogin() { document.getElementById("modalRoot").innerHTML = `<div class="overlay"><div class="sheet"><h3>🔐 Admin Login</h3><p style="font-size:13px;color:var(--text-light);margin-bottom:14px;font-weight:500;">Enter the admin password to continue</p><input class="form-input" id="adminPass" type="password" placeholder="Password" onkeypress="if(event.key==='Enter')verifyAdmin()" /><button class="btn btn-primary btn-block" onclick="verifyAdmin()">Login</button></div></div>`; setTimeout(() => document.getElementById('adminPass')?.focus(), 100); }

  function verifyAdmin() { const pass = document.getElementById('adminPass').value; if (pass === ADMIN_PASSWORD) { state.isLoggedIn = true; localStorage.setItem("syedgo_admin_logged", "true"); closeModal(); startListeners(); render(); toast("Welcome, Admin!", "success"); } else toast("Wrong password", "error"); }

  function adminLogout() { if (!confirm("Logout?")) return; state.isLoggedIn = false; localStorage.removeItem("syedgo_admin_logged"); Object.values(state.listeners).forEach(unsub => { if (typeof unsub === "function") unsub(); }); state.listeners = {}; render(); toast("Logged out", "info"); }

  function startListeners() {
    if (!state.isLoggedIn) return;
    if (!state.listeners.orders) state.listeners.orders = onSnapshot(collection(db, "orders"), (snap) => { const arr = []; snap.forEach(d => arr.push({ id: d.id, ...d.data() })); arr.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)); state.orders = arr; updateOrderBadge(); if (["dashboard", "orders", "reports"].includes(state.tab)) render(); });
    if (!state.listeners.merchants) state.listeners.merchants = onSnapshot(collection(db, "merchants"), (snap) => { const arr = []; snap.forEach(d => arr.push({ id: d.id, ...d.data() })); state.merchants = arr; if (["merchants", "dashboard", "reports"].includes(state.tab)) render(); });
    if (!state.listeners.riders) state.listeners.riders = onSnapshot(collection(db, "riders"), (snap) => { const arr = []; snap.forEach(d => arr.push({ id: d.id, ...d.data() })); state.riders = arr; if (["riders", "dashboard", "reports"].includes(state.tab)) render(); });
    if (!state.listeners.customers) state.listeners.customers = onSnapshot(collection(db, "users"), (snap) => { const arr = []; snap.forEach(d => arr.push({ id: d.id, ...d.data() })); state.customers = arr; if (["customers", "dashboard"].includes(state.tab)) render(); });
    if (!state.listeners.payouts) state.listeners.payouts = onSnapshot(collection(db, "payouts"), (snap) => { const arr = []; snap.forEach(d => arr.push({ id: d.id, ...d.data() })); arr.sort((a, b) => new Date(b.requestedAt) - new Date(a.requestedAt)); state.payouts = arr; if (["payouts", "dashboard"].includes(state.tab)) render(); });
    if (!state.listeners.reviews) state.listeners.reviews = onSnapshot(collection(db, "reviews"), (snap) => { const arr = []; snap.forEach(d => arr.push({ id: d.id, ...d.data() })); state.reviews = arr; if (["merchants", "riders", "reports"].includes(state.tab)) render(); });
    if (!state.listeners.settings) state.listeners.settings = onSnapshot(doc(db, "settings", "global"), (snap) => {
      if (snap.exists()) { state.settings = { ...state.settings, ...snap.data() }; if (["settings", "merchants"].includes(state.tab)) render(); }
      else { setDoc(doc(db, "settings", "global"), state.settings); }
    });
  }

  function updateOrderBadge() { const pending = state.orders.filter(o => o.status === "Placed").length; const badge = document.getElementById("orderBadge"); if (pending > 0) { badge.textContent = pending; badge.classList.remove("hidden"); } else badge.classList.add("hidden"); }

  function getStatusClass(status) { if (status === "Placed") return "pending"; if (status === "Accepted by Store") return "accepted"; if (status === "Ready for Pickup") return "ready"; if (["Rider Assigned", "Picked Up", "On the Way"].includes(status)) return "assigned"; if (status === "Delivered") return "delivered"; if (["Cancelled", "Rejected"].includes(status)) return "cancelled"; return ""; }

  function calcMerchantRating(merchantDoc) {
    const mm = merchantDoc.merchant || merchantDoc;
    const storeName = mm.storeName || "";
    const myOrders = state.orders.filter(o => (o.items || []).some(i => i.shopName && i.shopName.toLowerCase() === storeName.toLowerCase()));
    const delivered = myOrders.filter(o => o.status === "Delivered");
    const storeReviews = state.reviews.filter(r => r.type === "store" && r.storeName === storeName);
    const avgReviewRating = storeReviews.length > 0 ? storeReviews.reduce((s, r) => s + (r.rating || 0), 0) / storeReviews.length : 0;
    if (delivered.length === 0 && storeReviews.length === 0) return { rating: "New", count: 0, score: 0, deliveredCount: 0, totalOrders: myOrders.length, reviewAvg: 0, reviewCount: 0 };
    const deliveryRate = myOrders.length > 0 ? delivered.length / myOrders.length : 0;
    const volumeScore = Math.min(delivered.length / 50, 1);
    const autoScore = (deliveryRate * 0.6 + volumeScore * 0.4) * 5;
    let finalScore = autoScore;
    if (storeReviews.length > 0) finalScore = (autoScore * 0.4 + avgReviewRating * 0.6);
    return { rating: finalScore.toFixed(1), count: delivered.length, score: finalScore, deliveredCount: delivered.length, totalOrders: myOrders.length, deliveryRate: (deliveryRate * 100).toFixed(0), reviewAvg: avgReviewRating.toFixed(1), reviewCount: storeReviews.length };
  }

  function calcRiderRating(rider) {
    const myOrders = state.orders.filter(o => o.rider && o.rider.phone === rider.phone);
    const delivered = myOrders.filter(o => o.status === "Delivered");
    const riderReviews = state.reviews.filter(r => r.type === "rider" && r.riderPhone === rider.phone);
    const avgReviewRating = riderReviews.length > 0 ? riderReviews.reduce((s, r) => s + (r.rating || 0), 0) / riderReviews.length : 0;
    if (myOrders.length === 0 && riderReviews.length === 0) return { rating: "New", count: 0, score: 0, deliveredCount: 0, totalOrders: 0, completionRate: 0, reviewAvg: 0, reviewCount: 0 };
    const completionRate = myOrders.length > 0 ? delivered.length / myOrders.length : 0;
    const volumeScore = Math.min(delivered.length / 100, 1);
    const autoScore = (completionRate * 0.7 + volumeScore * 0.3) * 5;
    let finalScore = autoScore;
    if (riderReviews.length > 0) finalScore = (autoScore * 0.4 + avgReviewRating * 0.6);
    return { rating: finalScore.toFixed(1), count: delivered.length, score: finalScore, deliveredCount: delivered.length, totalOrders: myOrders.length, completionRate: (completionRate * 100).toFixed(0), reviewAvg: avgReviewRating.toFixed(1), reviewCount: riderReviews.length };
  }

  function getRatingColor(score) { if (score >= 4.5) return "linear-gradient(135deg,#22C55E,#16A34A)"; if (score >= 3.5) return "linear-gradient(135deg,#84CC16,#65A30D)"; if (score >= 2.5) return "linear-gradient(135deg,#F59E0B,#D97706)"; if (score >= 1.5) return "linear-gradient(135deg,#EF4444,#DC2626)"; return "linear-gradient(135deg,#64748B,#475569)"; }

  function toggleDarkMode() { state.darkMode = !state.darkMode; localStorage.setItem("syedgo_admin_dark", state.darkMode); applyDarkMode(); render(); }
  function applyDarkMode() { if (state.darkMode) { document.body.classList.add("dark"); document.getElementById("darkToggle").textContent = "☀️"; } else { document.body.classList.remove("dark"); document.getElementById("darkToggle").textContent = "🌙"; } }

  }

    const todayRevenue = delivered.filter(o => new Date(o.createdAt).toDateString() === today).reduce((sum, o) => { const pf = o.platformFee || state.settings.platformFee; const comm = Math.round((o.subtotal || 0) * cr); const dm = Math.max(0, (o.delivery || 0) - (o.riderEarning || state.settings.riderCut)); return sum + pf + comm + dm; }, 0);

    return `<h2>📊 Dashboard</h2>

        <div class="stat-box"><div class="num">${todayOrders.length}</div><div class="lbl">Today's Orders</div></div>
        <div class="stat-box red"><div class="num">${pending}</div><div class="lbl">Pending</div></div>
        <div class="stat-box amber"><div class="num">${active}</div><div class="lbl">Active</div></div>
        <div class="stat-box"><div class="num">${cancelled}</div><div class="lbl">Cancelled</div></div>
      </div>
      <h2 style="margin-top:20px;">🏢 Platform Overview</h2>
      <div class="stat-grid">
        <div class="stat-box"><div class="num">${state.customers.length}</div><div class="lbl">Customers</div></div>
        <div class="stat-box"><div class="num">${state.merchants.length}</div><div class="lbl">Merchants</div></div>

      </div>
      <h2 style="margin-top:20px;">📦 Recent Orders</h2>
      ${state.orders.slice(0, 3).map(o => `<div class="card" style="cursor:pointer;" onclick="openOrderDetail('${o.id}')"><div class="list-header"><b style="font-weight:800;">#${o.id}</b><span class="status-chip ${getStatusClass(o.status)}">${o.status}</span></div><p style="font-size:12px;margin-top:6px;font-weight:600;">${o.userName || 'Customer'} • Rs ${o.total}</p><p style="font-size:11px;color:var(--text-light);margin-top:2px;font-weight:500;">${new Date(o.createdAt).toLocaleString()}</p></div>`).join("") || `<div class="empty">${emptyDataSVG()}<h3>No orders yet</h3><p>Orders will appear here as customers place them</p></div>`}`;
  }

    document.getElementById("modalRoot").innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;"><h3 style="margin:0;">Order #${o.id}</h3><button class="btn btn-outline btn-sm" onclick="closeModal()">✕</button></div><span class="status-chip ${getStatusClass(o.status)}">${o.status}</span><p style="font-size:12px;color:var(--text-light);margin-top:8px;font-weight:500;">${new Date(o.createdAt).toLocaleString()}</p>
      <div class="card" style="margin-top:16px;"><h3 style="font-size:13px;margin-bottom:8px;">👤 Customer</h3><div class="order-row"><span>Name</span><span>${o.userName || '-'}</span></div><div class="order-row"><span>Phone</span><span>${o.userPhone || '-'}</span></div><div class="order-row"><span>Address</span><span style="font-size:11px;text-align:right;max-width:60%;">${o.address?.details || '-'}</span></div>${o.address?.lat ? `<div class="order-row"><span>GPS</span><span style="font-size:11px;">${o.address.lat.toFixed(5)}, ${o.address.lng.toFixed(5)}</span></div>` : ''}</div>
      <div class="card"><h3 style="font-size:13px;margin-bottom:8px;">🛍️ Items</h3>${(o.items || []).map(i => `<div class="order-row"><span>${i.name} × ${i.qty}</span><span style="font-feature-settings:'tnum';">Rs ${i.price * i.qty}</span></div>`).join("")}</div>
      ${o.pickup ? `<div class="card" style="background:var(--bg);"><h3 style="font-size:13px;margin-bottom:8px;">🏪 Pickup Location</h3><div class="order-row"><span>Store</span><span>${o.pickup.name || '-'}</span></div><div class="order-row"><span>Address</span><span style="font-size:11px;text-align:right;max-width:60%;">${o.pickup.address || '-'}</span></div>${o.pickup.location ? `<div class="order-row"><span>GPS</span><span style="font-size:11px;">${o.pickup.location.lat?.toFixed(5)}, ${o.pickup.location.lng?.toFixed(5)}</span></div>` : ''}</div>` : ''}
      ${o.rider ? `<div class="card" style="background:var(--brand-light);"><h3 style="font-size:13px;margin-bottom:8px;color:var(--brand-dark);">🛵 Rider</h3><div class="order-row"><span>Name</span><span>${o.rider.name || '-'}</span></div><div class="order-row"><span>Phone</span><span>${o.rider.phone || '-'}</span></div><div class="order-row"><span>Bike</span><span>${o.rider.bike || '-'}</span></div><div class="order-row"><span>Earning</span><span>Rs ${o.riderEarning || 120}</span></div></div>` : ''}
      <div class="card"><h3 style="font-size:13px;margin-bottom:8px;">💰 Financials</h3><div class="order-row"><span>Products</span><span>Rs ${o.subtotal || 0}</span></div><div class="order-row"><span>Delivery Fee</span><span>Rs ${o.delivery || 0}</span></div><div class="order-row"><span>Platform Fee</span><span>Rs ${platformFee}</span></div>${o.discount > 0 ? `<div class="order-row" style="color:var(--success);"><span>Discount</span><span style="color:var(--success);">-Rs ${o.discount}</span></div>` : ''}<div class="order-row" style="border-top:1px solid var(--border);padding-top:8px;margin-top:8px;"><span style="font-weight:800;color:var(--text);"><b>Customer Paid</b></span><span style="font-weight:800;color:var(--brand);font-size:14px;">Rs ${o.total}</span></div></div>

      <button class="btn btn-outline btn-block" onclick="closeModal()" style="margin-top:12px;">Close</button></div></div>`;
  }

      let list = state.merchants || [];

        const q = state.searchQuery.toLowerCase();

      }

  function renderRiders() {

    list = [...list].sort((a, b) => calcRiderRating(b).score - calcRiderRating(a).score);
    return `<h2>🛵 Riders (${list.length})</h2><input class="search-input" placeholder="Search rider..." value="${state.searchQuery}" oninput="state.searchQuery=this.value; render();" />
      ${list.length === 0 ? `<div class="empty">${emptyDataSVG()}<h3>No riders yet</h3><p>Registered riders will appear here</p></div>` : list.map(r => {
        const rating = calcRiderRating(r);

  function getDateRange(range) {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if (range === "today") return { from: today, to: now };
    if (range === "7days") return { from: new Date(today.getTime() - 6 * 24 * 60 * 60 * 1000), to: now };
    if (range === "30days") return { from: new Date(today.getTime() - 29 * 24 * 60 * 60 * 1000), to: now };
    if (range === "thisMonth") return { from: new Date(now.getFullYear(), now.getMonth(), 1), to: now };
    return { from: new Date(today.getTime() - 6 * 24 * 60 * 60 * 1000), to: now };
  }

  function filterOrdersByRange(orders, range) { const { from, to } = getDateRange(range); return orders.filter(o => { const d = new Date(o.createdAt); return d >= from && d <= to; }); }

  function buildSalesTrendData(orders, range) {
    const { from } = getDateRange(range);
    const days = range === "today" ? 1 : range === "30days" || range === "thisMonth" ? 30 : 7;
    const labels = [], salesData = [], ordersData = [];
    for (let i = days - 1; i >= 0; i--) {
      const d = new Date(from.getTime() + i * 24 * 60 * 60 * 1000);
      const dayStr = d.toLocaleDateString('en', { day: 'numeric', month: 'short' });
      labels.push(dayStr);
      const dayOrders = orders.filter(o => new Date(o.createdAt).toDateString() === d.toDateString());
      const dayDelivered = dayOrders.filter(o => o.status === "Delivered");
      salesData.push(dayDelivered.reduce((s, o) => s + (o.total || 0), 0));
      ordersData.push(dayOrders.length);
    }
    return { labels, salesData, ordersData };
  }

  function renderReports() {
    const filteredOrders = filterOrdersByRange(state.orders, state.reportRange);
    const delivered = filteredOrders.filter(o => o.status === "Delivered");
    const cancelled = filteredOrders.filter(o => ["Cancelled", "Rejected"].includes(o.status));
    const totalSales = delivered.reduce((s, o) => s + (o.total || 0), 0);
    const totalOrders = filteredOrders.length;
    const avgOrderValue = delivered.length > 0 ? Math.round(totalSales / delivered.length) : 0;
    const cancelRate = totalOrders > 0 ? ((cancelled.length / totalOrders) * 100).toFixed(1) : 0;
    const merchantStats = {};
    delivered.forEach(o => { (o.items || []).forEach(i => { if (!i.shopName) return; if (!merchantStats[i.shopName]) merchantStats[i.shopName] = { name: i.shopName, orders: 0, revenue: 0 }; merchantStats[i.shopName].orders++; merchantStats[i.shopName].revenue += i.price * i.qty; }); });
    const topMerchants = Object.values(merchantStats).sort((a, b) => b.revenue - a.revenue).slice(0, 5);
    const riderStats = {};
    delivered.forEach(o => { if (!o.rider) return; const phone = o.rider.phone; if (!riderStats[phone]) riderStats[phone] = { name: o.rider.name, phone, deliveries: 0, earned: 0 }; riderStats[phone].deliveries++; riderStats[phone].earned += (o.riderEarning || 120); });
    const topRiders = Object.values(riderStats).sort((a, b) => b.deliveries - a.deliveries).slice(0, 5);
    const rangeLabel = { today: "Today", "7days": "Last 7 Days", "30days": "Last 30 Days", thisMonth: "This Month" }[state.reportRange] || "Last 7 Days";
    return `<h2>📈 Reports & Analytics</h2>

        <div class="filter-chip ${state.reportRange==='today'?'active':''}" onclick="state.reportRange='today';render();">Today</div>

      </div>
      <div class="stat-grid">
        <div class="stat-box accent"><div class="num">Rs ${totalSales}</div><div class="lbl">Total Sales (${rangeLabel})</div></div>
        <div class="stat-box blue"><div class="num">${totalOrders}</div><div class="lbl">Total Orders</div></div>
        <div class="stat-box green"><div class="num">Rs ${avgOrderValue}</div><div class="lbl">Avg Order Value</div></div>
        <div class="stat-box red"><div class="num">${cancelRate}%</div><div class="lbl">Cancel Rate</div></div>
      </div>
      <div class="chart-container"><h3 style="margin-bottom:12px;font-size:14px;">💰 Sales Trend</h3><canvas id="salesChart"></canvas></div>
      <div class="chart-container"><h3 style="margin-bottom:12px;font-size:14px;">📦 Orders Trend</h3><canvas id="ordersChart"></canvas></div>
      <h3 style="margin-top:20px;margin-bottom:10px;">🏆 Top 5 Merchants by Revenue</h3>
      ${topMerchants.length === 0 ? '<div class="card"><p style="font-size:12px;color:var(--text-light);font-weight:500;">No data</p></div>' : `<div class="card">${topMerchants.map((m, i) => `<div class="report-row"><span><b style="font-weight:800;color:var(--brand);">#${i + 1}</b> ${m.name}</span><span style="font-weight:700;font-feature-settings:'tnum';">Rs ${m.revenue} (${m.orders})</span></div>`).join("")}</div>`}
      <h3 style="margin-top:20px;margin-bottom:10px;">🥇 Top 5 Riders by Deliveries</h3>
      ${topRiders.length === 0 ? '<div class="card"><p style="font-size:12px;color:var(--text-light);font-weight:500;">No data</p></div>' : `<div class="card">${topRiders.map((r, i) => `<div class="report-row"><span><b style="font-weight:800;color:var(--brand);">#${i + 1}</b> ${r.name}</span><span style="font-weight:700;font-feature-settings:'tnum';">${r.deliveries} • Rs ${r.earned}</span></div>`).join("")}</div>`}

      <div class="export-btn-group">
        <button class="btn btn-outline" onclick="exportCSV('orders')">📄 Orders CSV</button>
        <button class="btn btn-outline" onclick="exportCSV('merchants')">🏪 Merchants CSV</button>

  function renderCharts() {
    if (state.tab !== "reports") return;
    if (salesChartInstance) { salesChartInstance.destroy(); salesChartInstance = null; }
    if (ordersChartInstance) { ordersChartInstance.destroy(); ordersChartInstance = null; }
    const filteredOrders = filterOrdersByRange(state.orders, state.reportRange);

    const textColor = state.darkMode ? "#F1F5F9" : "#0F172A";

        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: textColor, font: { size: 10 } }, grid: { color: gridColor } }, y: { ticks: { color: textColor, font: { size: 10 } }, grid: { color: gridColor }, beginAtZero: true } } }

  function exportCSV(type) {
    let data = [], filename = "";
    if (type === "orders") { data = state.orders.map(o => ({ id: o.id, date: o.createdAt, customer: o.userName || "", phone: o.userPhone || "", items: (o.items || []).map(i => `${i.name} x${i.qty}`).join("; "), subtotal: o.subtotal || 0, delivery: o.delivery || 0, total: o.total || 0, status: o.status, rider: o.rider ? o.rider.name : "", pay: o.pay || "cod", mode: o.mode || "delivery" })); filename = `swatgo-orders-${Date.now()}.csv`; }
    else if (type === "merchants") { data = state.merchants.map(m => { const mm = m.merchant || m; const rating = calcMerchantRating(m); const hasLoc = mm.location && mm.location.lat; return { storeName: mm.storeName || "", phone: mm.phone || "", email: mm.email || "", category: mm.category || "", address: mm.address || "", hasLocation: hasLoc ? "Yes" : "No", lat: mm.location?.lat || "", lng: mm.location?.lng || "", productsCount: (m.products || []).length, orders: rating.totalOrders, delivered: rating.deliveredCount, rating: rating.rating, featured: (state.settings.featuredMerchants || []).includes(mm.phone) ? "Yes" : "No" }; }); filename = `swatgo-merchants-${Date.now()}.csv`; }
    else if (type === "riders") { data = state.riders.map(r => { const rating = calcRiderRating(r); const earned = state.orders.filter(o => o.rider && o.rider.phone === r.phone && o.status === "Delivered").reduce((s, o) => s + (o.riderEarning || 120), 0); return { name: r.name || "", phone: r.phone || "", bike: r.bike || "", totalAssigned: rating.totalOrders, delivered: rating.deliveredCount, completionRate: rating.completionRate + "%", rating: rating.rating, totalEarned: earned }; }); filename = `swatgo-riders-${Date.now()}.csv`; }
    else if (type === "customers") { data = state.customers.map(u => { const user = u.user || u; const userOrders = state.orders.filter(o => o.userPhone === user.phone); const spent = userOrders.filter(o => o.status === "Delivered").reduce((s, o) => s + (o.total || 0), 0); return { name: user.name || "", phone: user.phone || "", email: user.email || "", orders: userOrders.length, totalSpent: spent }; }); filename = `swatgo-customers-${Date.now()}.csv`; }
    if (data.length === 0) return toast("No data to export", "warning");
    const headers = Object.keys(data[0]);
    const csvRows = [headers.join(",")];
    data.forEach(row => { const values = headers.map(h => { const val = row[h]; const str = String(val === undefined || val === null ? "" : val); return `"${str.replace(/"/g, '""')}"`; }); csvRows.push(values.join(",")); });
    const csv = csvRows.join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
    toast("Exported successfully", "success");
  }
